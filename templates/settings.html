{% extends 'base.html' %}{% block title %}Profile Settings{% endblock %}{% block content %}<section class="admin-page"><a class="muted" href="{{ url_for('dashboard') }}">← Dashboard</a><h1>Profile settings</h1><form class="editor-form" method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">{% for key,label in [('name','Name'),('headline','Headline'),('intro','Introduction'),('email','Contact email'),('location','Location')] %}<label>{{ label }}{% if key=='intro' %}<textarea name="{{ key }}" rows="4">{{ settings.get(key,'') }}</textarea>{% else %}<input name="{{ key }}" value="{{ settings.get(key,'') }}">{% endif %}</label>{% endfor %}<label>Replace profile picture<input type="file" name="profile_image" accept="image/png,image/jpeg,image/webp"></label><button class="button">Save profile</button></form></section>{% endblock %}
